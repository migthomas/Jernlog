<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="StyrketrÃ¦ning: log sÃ¦t, ugeplan, vÃ¦gtforslag, fremgang og pausetimer.">
<meta name="theme-color" content="#ECEFF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1317" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body><title>Jernlog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one 640px column, sticky header, bottom tab bar. Palette borrowed from competition plates: blue (20 kg) drives actions, yellow (15 kg) marks records. */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --surface-2:#E3E8EC; --ink:#12171C; --ink-2:#55606B; --line:#CDD4DA;
  --plate:#1D55C4; --plate-ink:#FFFFFF; --pr:#F2B705; --pr-ink:#2A2000; --ok:#1E8449; --danger:#B93526;
  --f-display:'Big Shoulders Display','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --nav-h:60px;
  --fig:#2B3540; --fig-far:#A6B1BB; --mach:#8C98A4; --pad:#5D6975; --musc:#E5562C;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1317; --surface:#171C21; --surface-2:#202830; --ink:#E7EBEF; --ink-2:#98A3AE; --line:#2B343C;
    --plate:#6B9BFF; --plate-ink:#07142E; --pr:#F5C542; --pr-ink:#2A2000; --ok:#4CC27F; --danger:#FF7A6B;
  --fig:#D3DAE1; --fig-far:#56626E; --mach:#5E6A76; --pad:#7E8B98; --musc:#FF7B4F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1317; --surface:#171C21; --surface-2:#202830; --ink:#E7EBEF; --ink-2:#98A3AE; --line:#2B343C;
  --plate:#6B9BFF; --plate-ink:#07142E; --pr:#F5C542; --pr-ink:#2A2000; --ok:#4CC27F; --danger:#FF7A6B;
  --fig:#D3DAE1; --fig-far:#56626E; --mach:#5E6A76; --pad:#7E8B98; --musc:#FF7B4F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-inline:16px;-webkit-text-size-adjust:100%}
.shell{max-width:640px;margin-inline:auto;padding-bottom:calc(var(--nav-h) + 100px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--plate);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding-block:12px;background:var(--bg)}
.brand{font:800 22px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase}
#sync{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
#sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
#sync[data-state="busy"]::before{background:var(--pr)}
#sync[data-state="err"]::before{background:var(--danger)}

.stack{display:flex;flex-direction:column;gap:20px}
.stack-s{display:flex;flex-direction:column;gap:10px}
.eyebrow{margin:0;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.label{margin:0;font:700 14px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
h1,h2,h3{margin:0;font-family:var(--f-display);text-transform:uppercase;text-wrap:balance}
h1{font-weight:800;font-size:42px;line-height:.95;letter-spacing:.02em;margin-top:6px}
h2{font-weight:700;font-size:32px;line-height:1;letter-spacing:.02em}
h3{font-weight:700;font-size:22px;line-height:1.1;letter-spacing:.03em}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.note{color:var(--ink-2);font-size:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.plan-card{display:flex;flex-direction:column;gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:1.5px solid var(--plate);border-radius:6px;background:var(--plate);color:var(--plate-ink);font:700 20px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--line)}
.btn.sm{min-height:40px;padding:0 14px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 16px;border:1.5px solid var(--line);border-radius:999px;background:transparent;font-weight:500}
.chip[aria-pressed="true"]{background:var(--plate);border-color:var(--plate);color:var(--plate-ink)}

.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .when{font-weight:600}
.list .meta{color:var(--ink-2);font-size:14px;text-align:right;font-variant-numeric:tabular-nums}

.sess-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.ex-foot{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.set{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 48px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.set-h{border-top:0;padding:0 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-align:center}
.set .no{text-align:center;color:var(--ink-2);font-variant-numeric:tabular-nums}
.set input{width:100%;min-width:0;height:44px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:0 8px;font:600 18px var(--f-body);font-variant-numeric:tabular-nums;text-align:center}
.set.done input{color:var(--ink-2)}
.set.warm .no{font:700 13px/1 var(--f-display);letter-spacing:.08em;color:var(--pr-ink);background:var(--pr);border-radius:4px;padding:4px 0}
.set.warm input{background:transparent;border-style:dashed}
.chk{height:44px;width:48px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line);border-radius:6px;background:transparent;color:var(--ink-2)}
.set.done .chk{background:var(--plate);border-color:var(--plate);color:var(--plate-ink)}
.chk svg{width:22px;height:22px}
.exico{flex:none;width:52px;height:52px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:var(--surface-2);color:var(--ink)}
.exico svg{width:44px;height:44px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.exico .hd{fill:currentColor;stroke:none}
.exico .eq{stroke:var(--plate)}
.exico.sm{width:40px;height:40px;border-radius:8px}
.exico.sm svg{width:34px;height:34px}
.ico-btn{padding:0;border:0;background:transparent;border-radius:10px;flex:none;line-height:0}
.ico-btn:hover .exico{box-shadow:inset 0 0 0 1.5px var(--plate)}
.ex-foot .guide{margin-left:auto}
#sheet .ov{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,12,16,.5)}
#sheet .panel{width:100%;max-width:640px;max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:16px;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));border-radius:16px 16px 0 0;background:var(--surface);color:var(--ink)}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-head h2{font-size:30px}
.exico.big{width:100%;height:auto;padding:14px;border-radius:12px;gap:24px}
.exico.big svg{width:min(180px,46vw);height:auto;aspect-ratio:1;stroke-width:2.2}
.anim-svg path,.anim-svg circle,.anim-svg rect{stroke-linecap:round;stroke-linejoin:round}
.anim-svg .lb{stroke:var(--fig);fill:none}
.anim-svg .lf{stroke:var(--fig-far);fill:none}
.anim-svg .fill{fill:var(--fig);stroke:none}
.anim-svg .lf.fill{fill:var(--fig-far)}
.anim-svg .tor{stroke:var(--fig);stroke-width:3}
.anim-svg .nose{fill:var(--surface-2)}
.anim-svg .gh{stroke:var(--fig);fill:none}
.anim-svg .gh.fill{fill:var(--fig);stroke:none}
.anim-svg .gh.tor{fill:var(--fig);stroke:var(--fig)}
.anim-svg .ghost{opacity:.12}
.anim-svg .msc{stroke:var(--musc);fill:none}
.anim-svg .flr{stroke:var(--line);stroke-width:2}
.anim-svg .mach{stroke:var(--mach);fill:none}
.anim-svg .pad{fill:var(--pad);stroke:none}
.anim-svg .padl{stroke:var(--pad);fill:none}
.anim-svg .stack{fill:var(--mach);stroke:none;opacity:.55}
.anim-svg .stl{stroke:var(--surface-2);stroke-width:1.2}
.anim-svg .pul{fill:var(--surface-2);stroke:var(--mach);stroke-width:2.4}
.anim-svg .cab{stroke:var(--ink-2);stroke-width:1.2;fill:none}
.anim-svg .hdl{fill:var(--ink-2)}
.anim-svg .pl{fill:var(--plate);fill-opacity:.2;stroke:var(--plate);stroke-width:3}
.anim-svg .pl.solid{fill-opacity:1}
.anim-svg .plr{fill:none;stroke:var(--plate);stroke-width:1;stroke-opacity:.6}
.anim-svg .plh{fill:var(--plate)}
.anim-svg .pl.solid+.plh{fill:var(--surface-2)}
.anim-svg .pls{stroke:var(--plate);fill:none}
.anim-svg .bar{stroke:var(--ink-2);fill:var(--ink-2)}
.anim-svg .trk{fill:none;stroke:var(--plate);stroke-width:1.4;stroke-dasharray:1.5 3.5;opacity:.75}
.anim-svg .far{opacity:.45}
.anim{display:flex;flex-direction:column;gap:10px}
.anim-stage{background:var(--surface-2);border-radius:12px;padding:6px 6px 2px}
.anim-svg{display:block;width:100%;max-width:440px;height:auto;margin-inline:auto}
/* 3D-renderede billeder fra Blender: fast mørk baggrund, uanset lyst/mørkt tema */
.anim-stage.photo{background:#06080a;padding:0;overflow:hidden}
.anim-img{display:block;width:100%;height:auto;aspect-ratio:4/3;max-width:640px;margin-inline:auto}
.exico.ph{overflow:hidden;background:#06080a}
.exico.ph img{display:block;width:100%;height:100%;object-fit:cover}
.anim-ctl{display:flex;align-items:center;gap:10px}
.anim-btn{flex:none;width:44px;height:44px;padding:0;border-radius:50%;border:1.5px solid var(--plate);background:var(--plate);color:var(--plate-ink);display:inline-flex;align-items:center;justify-content:center}
.anim-btn svg{width:18px;height:18px;fill:currentColor}
.anim-now{flex:1;min-width:0;display:flex;flex-direction:column;min-height:40px;justify-content:center}
.anim-now b{font-weight:600;font-size:15px;line-height:1.25}
.anim-now span{font-size:13px;color:var(--ink-2)}
.anim-rep{font:700 15px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.anim-spd{flex:none;min-height:36px;min-width:44px;padding:0 10px;border:1.5px solid var(--line);border-radius:6px;background:transparent;font-weight:600}
.anim-tl{position:relative;display:flex;gap:3px}
.anim-tl .sg{min-width:0;height:22px;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border-radius:4px;background:var(--surface-2);color:var(--ink-2);font-size:11px;font-weight:600;letter-spacing:.04em;transition:background .2s,color .2s}
.anim-tl .sg.on{background:var(--plate);color:var(--plate-ink)}
.anim-tl .sg.ps.on{background:var(--ink-2)}
.anim-tl .mk{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--ink);pointer-events:none}
.anim-leg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:12px;color:var(--ink-2)}
.anim-leg i{display:inline-block;width:14px;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle}
.anim-leg .k1{background:var(--musc)}
.anim-leg .k2{background:var(--musc);opacity:.45}
.anim-leg .k3{height:0;border-top:2px dotted var(--plate);border-radius:0}
.anim-leg .k4{background:var(--ink-2);opacity:.3}
.anim-leg .v{margin-left:auto}
.how{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;max-width:62ch}
.how li::marker{font-weight:700;color:var(--plate)}
.tip{padding:10px 12px;border-left:3px solid var(--pr);background:var(--surface-2);border-radius:0 6px 6px 0;font-size:14px}
.alts{display:flex;flex-direction:column}
.alt{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.alts .alt:first-child{border-top:0}
.alt-n{flex:1;min-width:0;font-weight:500}
.alt-a{font:700 15px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--plate)}
.exico.xs{width:28px;height:28px;border-radius:999px}
.exico.xs svg{width:24px;height:24px;stroke-width:3}
.rel{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:10px}
.rel-l{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.rel-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.relchip{display:inline-flex;align-items:center;gap:8px;min-height:38px;max-width:100%;padding:3px 12px 3px 4px;border:1.5px solid var(--line);border-radius:999px;background:transparent;font-size:14px;font-weight:500;text-align:left}
.relchip:hover{border-color:var(--plate)}
.relchip span:last-child{min-width:0}
.ex-id{display:flex;align-items:center;gap:12px;min-width:0}
.ex-id>div,.ex-id>span:not(.exico){min-width:0}
.sug{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:12px;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.sug p{flex-basis:100%}
.sug .btn{margin-top:2px}
.sug-main{min-width:0;font-variant-numeric:tabular-nums}
.sug-chip{padding:3px 8px;border-radius:4px;border:1.5px solid var(--plate);color:var(--plate);font:700 13px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.sug[data-kind="up"] .sug-chip{background:var(--pr);border-color:var(--pr);color:var(--pr-ink)}
.sug[data-kind="deload"] .sug-chip{border-color:var(--danger);color:var(--danger)}
.sug[data-kind="new"] .sug-chip,.sug[data-kind="hold"] .sug-chip{border-color:var(--ink-2);color:var(--ink-2)}
.mgbox{display:flex;flex-direction:column;gap:2px;padding:12px 14px}
.mg{display:grid;grid-template-columns:64px minmax(0,1fr) 36px;gap:10px;align-items:center;min-height:30px}
.mg-l{font-size:14px;font-weight:500}
.mg .trk{position:relative;display:block;height:14px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.mg .zone{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.18}
.mg .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ink-2)}
.mg[data-st="in"] .fill{background:var(--ok)}
.mg[data-st="over"] .fill{background:var(--pr)}
.mg .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.mg-ax{min-height:18px}
.trk-ax{position:relative;display:block;height:16px}
.trk-ax span{position:absolute;top:0;transform:translateX(-50%);font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.trk-ax span:first-child{transform:none}
.trk-ax span:last-child{transform:translateX(-100%)}
.nx-name{display:block}
.nx{display:block;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.nx.up{color:var(--ink);font-weight:600}
.addex{display:flex;flex-wrap:wrap;gap:8px}
.addex .sel{flex:1 1 160px;min-width:0}
.addex .txt{flex:1 1 100%}
.txt{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 12px}
.row-actions{display:flex;gap:10px;flex-wrap:wrap}
.row-actions .btn:first-child{flex:1 1 220px}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-block:1px solid var(--line)}
.stats>div{padding:14px 10px 14px 0}
.stats>div+div{padding-left:14px;border-left:1px solid var(--line)}
.stats b{display:block;font:800 34px/1 var(--f-display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.stats b small{font-size:18px;color:var(--ink-2);font-weight:700}
.stats span{display:block;margin-top:4px;font-size:12px;color:var(--ink-2)}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tick{fill:var(--ink-2);font:11px var(--f-body)}
.chart .line{fill:none;stroke:var(--plate);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--plate);fill-opacity:.12;stroke:none}
.chart .dot{fill:var(--surface);stroke:var(--plate);stroke-width:2}
.chart .dot.end{fill:var(--plate)}
.chart .dot.pr{fill:var(--pr);stroke:var(--plate);stroke-width:2}
.chart .val{fill:var(--ink);font:700 12px var(--f-body)}
.chart .bar{fill:var(--plate)}
.chart .bar.past{fill-opacity:.45}
.chart .plan{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:4 4}
.sel{height:44px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 10px;max-width:100%}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pr{display:inline-block;padding:2px 6px;border-radius:3px;background:var(--pr);color:var(--pr-ink);font:700 12px/1.3 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.hist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.hist>li{border-bottom:1px solid var(--line)}
.hist-row{width:100%;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border:0;background:transparent;text-align:left}
.hist-row .hd{display:flex;flex-direction:column;min-width:0}
.hist-row .hd b{font-weight:600}
.hist-row .tl{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.detail{padding:0 0 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.detail .ln b{font-weight:600}

.banner{padding:12px 14px;border-radius:6px;background:var(--surface-2);border:1px dashed var(--ink-2);font-size:14px}
.day{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.day b{font-weight:600}
.day .tag{margin-left:8px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--plate)}
.tpl .ex-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.ftag{display:inline-block;margin-right:6px;padding:1px 6px;border-radius:4px;background:var(--plate);color:var(--plate-ink);font:700 11px/1.5 var(--f-display);letter-spacing:.1em;text-transform:uppercase;vertical-align:1px}
.tpl .ex-row.drop .nx-name{text-decoration:line-through;color:var(--ink-2)}
.tpl .ex-row.drop .ftag{text-decoration:none}
.tpl .ex-row.fadd{background:linear-gradient(90deg,color-mix(in srgb,var(--plate) 9%,transparent),transparent)}
.focus{border-left:4px solid var(--plate)}
.gym summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
.gym details .chips{margin-top:8px}
.gym .chip{min-height:36px;padding:0 12px;font-size:14px}
.focus .fg{display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:8px}
.fg-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fg-h b{font-weight:600}
.fg-h .chg{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.fi{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:4px 0;border:0;background:transparent;text-align:left}
.fi-t{min-width:0;flex:1}
.fi-box{flex:none;width:24px;height:24px;border:1.5px solid var(--line);border-radius:5px;display:inline-flex;align-items:center;justify-content:center}
.fi[aria-pressed="true"] .fi-box{background:var(--plate);border-color:var(--plate)}
.fi[aria-pressed="true"] .fi-box::after{content:"";width:6px;height:11px;border:solid var(--plate-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.fi[aria-pressed="false"] .fi-t,.fi[aria-pressed="false"] .exico{opacity:.45}
.fi[aria-pressed="false"] .nx-name{text-decoration:line-through}
.tpl .x{width:36px;height:36px;border:0;background:transparent;color:var(--ink-2);font-size:20px;line-height:1}
.tpl .nm{width:100%;height:44px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:0 12px;font:700 22px var(--f-display);letter-spacing:.03em;text-transform:uppercase}

.ringwrap{position:relative;width:min(280px,80%);margin-inline:auto}
.ring{display:block;width:100%;height:auto}
.ring .track{fill:none;stroke:var(--line);stroke-width:10}
.ring .prog{fill:none;stroke:var(--plate);stroke-width:10;transform:rotate(-90deg);transform-origin:100px 100px}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ringtxt b{font:800 64px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ringtxt span{font-size:13px;color:var(--ink-2)}
.ringwrap.fin .prog{stroke:var(--pr)}
.checkrow{display:flex;gap:10px;align-items:center;font-size:15px}
.checkrow input{width:22px;height:22px;accent-color:var(--plate)}
.empty{padding:28px 20px;border:1.5px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}

#restbar{position:fixed;left:16px;right:16px;bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom,0px));max-width:608px;margin-inline:auto;z-index:6;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:10px;background:var(--ink);color:var(--bg)}
#restbar .lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
#restbar b{font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums;margin-right:auto}
#restbar button{min-height:40px;padding:0 14px;border:1px solid currentColor;border-radius:6px;background:transparent;font-weight:600}
#restbar.fin{background:var(--pr);color:var(--pr-ink)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:640px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:var(--ink-2);font-size:12px;font-weight:500}
.tabs button[aria-current="page"]{color:var(--plate);font-weight:600}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 80px + env(safe-area-inset-bottom,0px));z-index:8;max-width:calc(100% - 32px);padding:12px 16px;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:500;text-align:center}
@media (prefers-reduced-motion:no-preference){.ring .prog{transition:stroke-dashoffset .25s linear}}

var DESC={
  'Bænkpres':[['Lig på bænken med øjnene lige under stangen og fødderne solidt i gulvet.','Grib lidt bredere end skulderbredde, pres skulderbladene sammen og løft stangen af.','Sænk stangen kontrolleret til nederste del af brystet, og pres den op igen.'],'At albuerne stritter lige ud til siden. Hold dem ca. 45° fra kroppen.'],

  'Håndvægtspres':[['Sid med håndvægtene på lårene, læn dig tilbage og bring dem op ved brystet.','Pres vægtene op, så de næsten mødes over brystet.','Sænk langsomt, til du mærker et stræk i brystet.'],'At lade vægtene falde ukontrolleret i bunden.'],

  'Dips':[['Støt på barrene med strakte arme og let foroverlænet overkrop.','Sænk dig, til overarmene er omtrent vandrette.','Pres op til strakte arme.'],'At gå så dybt, at skuldrene gør ondt. Stop ved vandret overarm.'],
  'Smal bænkpres':[['Grib stangen i skulderbredde.','Sænk stangen til nederste del af brystet med albuerne tæt ind til kroppen.','Pres op, og fokuser på at strække armene.'],'Et meget smalt greb, der belaster håndleddene.'],

  'Kabel sidehævninger':[['Stå med siden til kablet, og tag håndtaget med den yderste hånd.','Løft armen ud til siden, op til skulderhøjde.','Sænk langsomt, og hold spændingen i bunden.'],'At trække skulderen op mod øret.'],
  'Triceps pushdown':[['Stå tæt ved kablet med albuerne ind til siden.','Pres håndtaget ned, til armene er strakte.','Lad det gå op til ca. 90° i albuen uden at flytte overarmene.'],'At læne sig ind over og presse med kropsvægten.'],
  'Overhead triceps extension':[['Hold en håndvægt eller et reb over hovedet med begge hænder.','Sænk vægten bag hovedet ved kun at bøje albuerne.','Stræk armene op igen.'],'At albuerne glider langt ud til siden.'],
  'Siddende skrå triceps pushdown':[['Sæt den korte, bøjede stang på kablet i øverste position, og sæt dig på bænken foran kablet, let foroverlænet.','Hold albuerne fast ind til siden, og pres stangen skråt ned og frem, til armene er strakte.','Lad stangen komme langsomt op igen, til underarmene er lidt over vandret, uden at flytte overarmene.'],'At albuerne glider frem og op, så skuldrene tager over.'],
  'Skullcrushers':[['Lig på bænken med stangen strakt op over brystet.','Bøj albuerne, og sænk stangen mod panden eller lige bag hovedet.','Stræk armene igen uden at flytte overarmene.'],'At albuerne vandrer frem og tilbage.'],

  'Smal lat pulldown':[['Sæt de smalle håndtag med parallelt greb på kablet, og sæt dig med lårene låst under puderne.','Træk håndtagene ned mod øverste del af brystet med brystet frem og albuerne tæt ind langs kroppen.','Lad håndtagene gå langsomt op, til armene er strakte og du mærker et stræk i ryggen.'],'At læne sig langt tilbage og rykke vægten ned med kroppen.'],
  'Straight-arm pulldown':[['Stå foran kablet med strakte arme og let foroverlænet.','Pres stangen ned i en bue mod lårene med næsten strakte arme.','Før langsomt tilbage til øjenhøjde.'],'At bøje albuerne, så det bliver triceps, der arbejder.'],
  'Vandret roning':[['Bøj i hofterne, til overkroppen er ca. 45°, med ret ryg.','Træk stangen op mod navlen, og pres skulderbladene sammen.','Sænk kontrolleret.'],'At runde ryggen eller rette sig op for at få vægten med.'],
  'Kabelroning':[['Sid med let bøjede knæ og ret ryg.','Træk håndtaget ind mod maven, og pres skulderbladene sammen.','Stræk armene frem igen, og lad skuldrene følge med.'],'At gynge frem og tilbage med overkroppen.'],
  'Low row med smalt greb':[['Sæt det smalle håndtag med parallelt greb på det nederste kabel, sæt dig med fødderne mod pladen og let bøjede knæ.','Sid med ret ryg, og træk håndtaget ind mod navlen med albuerne tæt langs kroppen. Pres skulderbladene sammen bagerst.','Stræk armene frem igen, og lad skuldrene glide med frem, uden at runde ryggen.'],'At gynge frem og tilbage med overkroppen for at få vægten med.'],
  'Enarms håndvægtsroning':[['Støt den ene hånd og det ene knæ på bænken.','Træk håndvægten op mod hoften med albuen tæt ind til kroppen.','Sænk langsomt, til du mærker et stræk i ryggen.'],'At dreje overkroppen op for at løfte vægten.'],
  'Shrugs':[['Stå med en stang eller håndvægte ned langs kroppen.','Løft skuldrene lige op mod ørerne.','Hold kort i toppen, og sænk langsomt.'],'At rulle skuldrene rundt.'],
  'Face pulls':[['Sæt kablet i hovedhøjde med et reb.','Træk rebet mod ansigtet, og før hænderne ud til siden.','Før langsomt tilbage.'],'For tung vægt, så du læner dig tilbage.'],

function h(tag,attrs){
  var el=document.createElement(tag),val;
  var a=attrs||{};
  Object.keys(a).forEach(function(k){
    var v=a[k];
    if(v==null||v===false) return;
    if(k==='class') el.className=v;
    else if(k==='text') el.textContent=v;
    else if(k==='value') val=v;
    else if(k.slice(0,2)==='on') el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v===true?'':v);
  });
  for(var i=2;i<arguments.length;i++){ add(el,arguments[i]); }
  if(val!==undefined) el.value=val;
  return el;
}
function add(el,kid){
  if(kid==null||kid===false) return;
  if(Array.isArray(kid)){ kid.forEach(function(k){add(el,k)}); return; }
  el.append(kid.nodeType?kid:document.createTextNode(String(kid)));
}
function svg(tag,attrs){
  var el=document.createElementNS('http://www.w3.org/2000/svg',tag);
  var a=attrs||{};
  Object.keys(a).forEach(function(k){ if(a[k]!=null) el.setAttribute(k,a[k]); });
  for(var i=2;i<arguments.length;i++){ add(el,arguments[i]); }

}

var WK='jernlog:watch';

function newTopic(){
  var abc='abcdefghijklmnopqrstuvwxyz0123456789',b=new Uint8Array(26),s='jl-';
  crypto.getRandomValues(b);
  for(var i=0;i<b.length;i++) s+=abc.charAt(b[i]%abc.length);
  return s;
}
/* Det uret skal vise: pas, aktuel øvelse, næste sæt (kg × gentagelser) og pause. */
function watchState(){
  var o={v:1,pas:null,ex:null,set:0,sets:0,kg:null,reps:null,next:null,klar:false,hvile:null};
  var act=S.activeId&&S.sessions[S.activeId];
  if(act&&!act.done){
    o.pas=act.name;
    var pend=act.entries.filter(function(e){return e.sets.some(function(s){return !s.done})});
    if(pend.length){
      var e=pend[0],si=0;
      while(si<e.sets.length&&e.sets[si].done) si++;
      o.ex=e.ex; o.set=e.sets.slice(0,si).filter(function(x){return !x.warm}).length+(e.sets[si].warm?0:1); o.sets=workOf(e).length; o.opv=!!e.sets[si].warm;
      o.kg=e.sets[si].kg==null?null:e.sets[si].kg;
      o.reps=e.sets[si].reps==null?null:e.sets[si].reps;
      if(pend[1]) o.next=pend[1].ex;
    } else o.klar=act.entries.length>0;
  }
  if(T.running||T.finished) o.hvile={end:T.endAt,total:T.total};
  else if(T.left>0&&T.left<T.total) o.hvile={left:T.left,total:T.total};
  return o;
}
function watchStatus(t){W.status=t; var el=document.getElementById('watch-status'); if(el) el.textContent=t}
function pushWatch(force){
  if(!W.on||!TOPIC_OK.test(W.topic)) return;
  clearTimeout(W.timer);
  W.timer=setTimeout(function(){
    var o=watchState(),body=JSON.stringify(o);
    if(!force&&body===W.last) return;
    W.last=body; o.t=Date.now();
    var d=new Date();
    try{
      fetch('https://ntfy.sh/'+W.topic,{method:'POST',body:JSON.stringify(o),mode:'no-cors'})
        .then(function(){watchStatus('Sendt kl. '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()))})
        .catch(function(){W.last='';watchStatus('Kunne ikke sende. Tjek nettet. Det virker kun i appen på telefonen.')});
    }catch(e){W.last='';watchStatus('Kunne ikke sende.')}
  },400);
}

/* ---------- derived data ---------- */
function doneSessions(){
  return Object.keys(S.sessions).filter(function(id){return S.sessions[id].done})
    .map(function(id){var s=Object.assign({},S.sessions[id]);s.id=id;return s})
    .sort(function(a,b){return a.startedAt-b.startedAt});
}
/* Opvarmingssæt (warm:true) tæller ikke med i sæt, volumen, rekorder, vægtforslag eller muskelgrupper. */
function doneSets(e){return e.sets.filter(function(s){return s.done&&s.reps>0&&!s.warm})}
function workOf(e){return e.sets.filter(function(s){return !s.warm})}
function e1rm(s){return s.kg>0&&s.reps>0?(s.reps===1?s.kg:s.kg*(1+s.reps/30)):null}
function isAssist(ex){var c=BYNAME[ex.toLowerCase()];return !!(c&&c[3][2]<0)}
function sessVol(s){
  return s.entries.reduce(function(a,e){if(isAssist(e.ex)) return a;return a+doneSets(e).reduce(function(b,x){return b+(x.kg||0)*x.reps},0)},0);
}
function sessSets(s){return s.entries.reduce(function(a,e){return a+doneSets(e).length},0)}
function lastSets(ex){
  var ds=doneSessions().reverse();
  for(var i=0;i<ds.length;i++){
    for(var j=0;j<ds[i].entries.length;j++){
      var e=ds[i].entries[j];
      if(e.ex===ex){ var d=doneSets(e); if(d.length) return {date:ds[i].date,sets:d}; }
    }
  }
  return null;
}
function summ(sets){return sets.map(function(s){return nf.format(s.kg||0)+'×'+s.reps}).join(' · ')}
function prMap(){
  var best={},out={};
  doneSessions().forEach(function(s){
    s.entries.forEach(function(e){
      if(isAssist(e.ex)) return;
      var m=0; doneSets(e).forEach(function(x){var v=e1rm(x); if(v&&v>m) m=v});
      if(!m) return;
      if(best[e.ex]!==undefined&&m>best[e.ex]+1e-9){ (out[s.id]=out[s.id]||[]).push(e.ex); }
      if(best[e.ex]===undefined||m>best[e.ex]) best[e.ex]=m;
    });
  });
  return out;
}
function series(ex,metric){
  var pts=[];
  doneSessions().forEach(function(s){
    s.entries.forEach(function(e){
      if(e.ex!==ex) return;
      var ds=doneSets(e); if(!ds.length) return;
      var v;
      if(isAssist(ex)){v=metric==='vol'?ds.reduce(function(a,x){return a+x.reps},0):Math.max.apply(null,ds.map(function(x){return x.reps}));if(v>0) pts.push({date:s.date,v:v});return}
      if(metric==='vol') v=ds.reduce(function(a,x){return a+(x.kg||0)*x.reps},0);
      else if(metric==='max') v=Math.max.apply(null,ds.map(function(x){return x.kg||0}));
      else v=Math.max.apply(null,ds.map(function(x){return e1rm(x)||0}));
      if(v>0) pts.push({date:s.date,v:v});
    });
  });
  return pts;
}
function allExercises(){
  var set={};
  SUGGEST.forEach(function(x){set[x]=1});
  S.plan.templates.forEach(function(t){t.exercises.forEach(function(x){set[x]=1})});
  Object.keys(S.sessions).forEach(function(id){S.sessions[id].entries.forEach(function(e){set[e.ex]=1})});
  return Object.keys(set).sort(function(a,b){return a.localeCompare(b,'da')});
}

  clearTimeout(P.pend.get(id));
  P.pend.set(id,setTimeout(function(){flush(id)},500));

function flush(id){
  P.pend.delete(id);
  P.run.set(id,(P.run.get(id)||0)+1);

    await READY;

    catch(e){
      S.syncErr=(e&&e.code==='invalid_argument')?'Kan ikke gemme (kun visning)':'Kunne ikke gemme';

function syncUI(){

  else if(anyBusy()){t='Gemmer…';st='busy'}
  else if(backend.kind==='db'){t='Gemt'}

}
function adoptActive(){
  var cur=S.sessions[S.activeId];
  if(cur&&!cur.done) return;

    .sort(function(a,b){return S.sessions[b].startedAt-S.sessions[a].startedAt})[0];

function onSnap(snap){

    if(id==='plan'){
      if(stable(S.plan)!==stable(data)){S.plan=normPlan(clone(data));changed=true; if(MIGRATED){MIGRATED=false;save('plan')}}
    } else if(id.indexOf('s_')===0){
      if(!S.sessions[id]||stable(S.sessions[id])!==stable(data)){S.sessions[id]=clone(data);changed=true}
    }
  });
  if(!snap.metadata.fromCache){
    Object.keys(S.sessions).forEach(function(id){
      if(!seen[id]&&!busy(id)){delete S.sessions[id];changed=true}

function loadLocal(){

    if(raw){var o=JSON.parse(raw); if(o.plan) S.plan=normPlan(o.plan); S.sessions=o.sessions||{};}
  }catch(e){}
  if(MIGRATED){MIGRATED=false;save('plan')}

}

function ask(key,action){

/* ---------- Ugens fokus ----------

   - Under 10 sæt: ekstra øvelser (3 sæt) i det pas, gruppen hører naturligt til, til gruppen når 10. Højst 2 ekstra øvelser og 8 ekstra sæt pr. pas,
     så passet ikke bliver for langt. Gruppen med størst mangel kommer først.
     Er der ikke flere passende øvelser, lægges sæt oven i en eksisterende øvelse.
   - Over 20 sæt: én øvelse sættes på pause, hvis det ikke trækker andre grupper under 10.
   Ændringerne gælder kun den ene uge og ligger i S.plan.focus = {week, base, items:[{type:'add'|'sets'|'drop', tid, ex, n, m, off}]}. */
var MCAT={Bryst:'Push',Skuldre:'Push',Triceps:'Push',Ryg:'Pull',Biceps:'Pull','Forlår':'Core + Ben',Baller:'Core + Ben','Baglår':'Core + Ben','Lægge':'Core + Ben',Mave:'Core + Ben'};

function focusLive(){
  var f=S.plan.focus;

}
function focusActive(){
  var f=S.plan.focus;

/* Passets øvelser denne uge, med fokus lagt oveni. */
function effEx(t){
  var list=t.exercises.map(function(x){return {ex:x,extra:0}});

  f.items.forEach(function(it){
    if(it.tid!==t.id||it.off) return;

    else if(it.type==='sets') list.forEach(function(o){if(o.ex===it.ex) o.extra+=it.n});

function focusEntry(o){

function tplCat(t){
  var c={},best=null;

function focusPlan(off){

  if(!tpls.length){tpls=S.plan.templates.filter(function(t){return t.exercises.length});tpls.forEach(function(t){fr[t.id]=1})}

/* ---------- Ekstra pas: forslag ud fra ugens sæt pr. muskelgruppe ----------
   Medregner de planlagte pas, der er tilbage i ugen (inkl. ugens fokus), så forslaget kun fylder de huller,
   planen ikke selv lukker. Vælger øvelser med gruppen som primær muskel og undgår at skubbe andre grupper over 20 sæt. */
var EXTRA_MAX_EX=6,EXTRA_MAX_SETS=20;
function weekRemaining(){
  var now=new Date(),ti=dayIdx(now),today=iso(now);
  var doneToday=doneSessions().some(function(s){return s.date===today});
  var out=[];
  S.plan.week.forEach(function(id,i){
    if(!id||i<ti||(i===ti&&doneToday)) return;
    var t=S.plan.templates.filter(function(x){return x.id===id})[0];
    if(t&&t.exercises.length) out.push({t:t,day:i});
  });
  return out;
}
function extraPlan(){
  var w=muscleWeek(0),proj={},rem=weekRemaining();
  MUSCLES.forEach(function(m){proj[m]=w.tot[m]});
  rem.forEach(function(r){
    effEx(r.t).forEach(function(o){
      var mm=muscles(o.ex); if(!mm) return;
      var n=o.n||suggest(o.ex).n+(o.extra||0);
      Object.keys(mm).forEach(function(m){if(m in proj) proj[m]+=n*mm[m]});
    });
  });
  var start={};MUSCLES.forEach(function(m){start[m]=proj[m]});
  var picks=[],used={},total=0;
  function def(m){return MTARGET[0]-proj[m]}
  for(var guard=0;guard<12&&picks.length<EXTRA_MAX_EX&&total<EXTRA_MAX_SETS;guard++){
    var need=MUSCLES.filter(function(m){return def(m)>.25}).sort(function(a,b){return def(b)-def(a)});
    if(!need.length) break;
    var m=need[0],n=Math.max(2,Math.min(4,Math.ceil(def(m)),EXTRA_MAX_SETS-total));
    if(n<2) break;
    var best=null;
    CATALOG.forEach(function(c){
      if(used[c[0]]||c[4][m]!==1||!hasEq(c[0])) return;
      var mm=c[4],ok=true,gain=0;
      Object.keys(mm).forEach(function(k){
        if(!(k in proj)) return;
        if(proj[k]+n*mm[k]>MTARGET[1]) ok=false;
        if(k!==m&&def(k)>0) gain+=Math.min(def(k),n*mm[k]);
      });
      if(!ok) return;
      var sc=(history(c[0],1).length?3:0)+gain*.6-(Object.keys(mm).length>1&&!gain?.5:0);
      if(!best||sc>best.sc) best={sc:sc,c:c};
    });
    if(!best){proj[m]=MTARGET[0];continue}
    used[best.c[0]]=1; total+=n;
    picks.push({ex:best.c[0],n:n,m:m});
    Object.keys(best.c[4]).forEach(function(k){if(k in proj) proj[k]+=n*best.c[4][k]});
  }
  return {w:w,rem:rem,start:start,proj:proj,picks:picks,total:total};
}

/* ---------- detaljerede øvelsesanimationer ----------
   En figur med led (fra siden eller forfra). Hver øvelse har en start- og vendestilling; vinkler og mål glider mellem dem,
   og arme/ben med et mål (fx stangen) regnes ud med to-leds IK, så lemmerne holder længden. */
var ANIM=(function(){
var F=142,LT=40,LU=25,LF=23,LTH=34,LS=33,LFT=13,NK=5,HR=8.5;
function dir(a){a=a*Math.PI/180;return [Math.sin(a),-Math.cos(a)]}
function nrm(a){a=a*Math.PI/180;return [Math.cos(a),Math.sin(a)]}
function add(p,v,k){return [p[0]+v[0]*k,p[1]+v[1]*k]}
function ang(p,q){return Math.atan2(q[0]-p[0],-(q[1]-p[1]))*180/Math.PI}
function dist(p,q){return Math.hypot(q[0]-p[0],q[1]-p[1])}
function nd(x){return ((x%360)+540)%360-180}
function ik(r,t,l1,l2,b){
  var d=dist(r,t),base=ang(r,t);
  d=Math.max(Math.abs(l1-l2)+.01,Math.min(l1+l2-.01,d));
  var c=(l1*l1+d*d-l2*l2)/(2*l1*d);c=Math.max(-1,Math.min(1,c));
  var j=add(r,dir(base+b*Math.acos(c)*180/Math.PI),l1);
  return [j,add(r,dir(base),d)];
}
function f(n){return Math.round(n*10)/10}
function P2(p){return f(p[0])+' '+f(p[1])}
function ln(p,q,c,w){return '<path class="'+c+'" d="M'+P2(p)+'L'+P2(q)+'"'+(w?' stroke-width="'+w+'"':'')+'/>'}
function pl(pts,c,w){return '<path class="'+c+'" d="M'+pts.map(P2).join('L')+'"'+(w?' stroke-width="'+w+'"':'')+'/>'}
function ci(p,r,c){return '<circle class="'+c+'" cx="'+f(p[0])+'" cy="'+f(p[1])+'" r="'+r+'"/>'}
function rc(x,y,w,h,c,rx){return '<rect class="'+c+'" x="'+f(x)+'" y="'+f(y)+'" width="'+f(w)+'" height="'+f(h)+'" rx="'+(rx||1.5)+'"/>'}

/* ---------- løsning af en stilling til ledpunkter ---------- */
function target(P,k,J){
  var v;
  if(v=P['H'+k]) return v;
  if(v=P['HS'+k]) return [J.sh[0]+v[0],J.sh[1]+v[1]];
  if(v=P['HH'+k]) return [J.hip[0]+v[0],J.hip[1]+v[1]];
  if(v=P['HK'+k]) return [J.kn1[0]+v[0],J.kn1[1]+v[1]];
  if(v=P['HT'+k]) return add(add(J.sh,dir(P.t),v[0]),nrm(P.t),v[1]);
  if(v=P['HF'+k]){var dy=v[0]-J.sh[1];return [J.sh[0]+Math.sqrt(Math.max(0,v[1]*v[1]-dy*dy)),v[0]]}
  return null;
}
function arm(P,k,root,J){
  var uk=P['uk'+k]||1,fk=P['fk'+k]||1,t=target(P,k,J),el,ha;
  if(P.fs&&t){uk=fk=Math.min(1,(dist(root,t)+1.5)/(LU+LF));J['fs'+k]=uk}
  if(t){var r=ik(root,t,LU*uk,LF*fk,P['kb'+k]||1);
    if(P.v!=='f'&&!P.kbf){r=ik(root,t,LU*uk,LF*fk,1);if(nd(ang(root,r[0])-ang(r[0],r[1]))<0) r=ik(root,t,LU*uk,LF*fk,-1)}
    el=r[0];ha=r[1]}
  else{var o=P.ar?P.t:0;el=add(root,dir(P['ua'+k]+o),LU*uk);ha=add(el,dir(P['fa'+k]+o),LF*fk)}
  J['el'+k]=el;J['ha'+k]=ha;J['ua'+k]=ang(root,el);J['fa'+k]=ang(el,ha);
}
function leg(P,k,root,J){
  var kn,an,tk=P['thk'+k]||1;
  if(P['A'+k]){var r=ik(root,P['A'+k],LTH*tk,LS,P['lb'+k]||-1);
    if(P.v!=='f'){r=ik(root,P['A'+k],LTH*tk,LS,1);if(nd(ang(r[0],r[1])-ang(root,r[0]))<0) r=ik(root,P['A'+k],LTH*tk,LS,-1)}
    kn=r[0];an=r[1]}
  else if(P['K'+k]){kn=P['K'+k];an=add(kn,dir(P['sh'+k]),LS)}
  else{kn=add(root,dir(P['th'+k]),LTH*tk);an=add(kn,dir(P['sh'+k]),LS)}
  J['kn'+k]=kn;J['an'+k]=an;J['th'+k]=ang(root,kn);J['sh'+k]=ang(kn,an);
  J['to'+k]=P.v==='f'?add(an,[k===1?1:-1,0],6):add(an,dir(P['p'+k]==null?95:P['p'+k]),LFT);
}
var MIRROR=[['ua','fa','H','HS','HH','HK','HT','HF','kb','uk','fk'],['A','K','th','sh','lb','p','thk']];
function fill2(P){MIRROR.forEach(function(g){fillG(P,g)})}
function fillG(P,G){
  var has=false;G.forEach(function(n){if(P[n+'2']!=null)has=true});
  if(has) return;
  G.forEach(function(n){
    var v=P[n+'1'];if(v==null) return;
    if(P.v!=='f'){P[n+'2']=v;return}
    if(n==='ua'||n==='fa'||n==='th'||n==='sh') P[n+'2']=-v;
    else if(n==='kb'||n==='lb') P[n+'2']=-v;

        p=add(add(J.hip,dir(a),L*s[1]),N,s[3]);q=add(add(J.hip,dir(a),L*s[2]),N,s[3]);}
      else{var k=s[0].slice(-1),root=s[0][0]==='U'?J['s'+k]:J['h'+k],end=s[0][0]==='U'?J['el'+k]:J['kn'+k];

  o+=(J.eqMid||'');
  // krop
  o+=ln(J.hip,J.sh,c,14)+ln(add(J.hip,dir(ang(J.hip,J.sh)),dist(J.hip,J.sh)*.45),J.sh,c,16.5);
  if(!ghost) o+=muscleSide(J,list.filter(function(m){return MS[m[0]]&&MS[m[0]][0][0]==='T'}),op);
  o+=ln(J.hip,J.kn1,c,12)+ln(J.kn1,J.an1,c,9.5)+ln(J.an1,J.to1,c,6);
  if(!ghost) o+=muscleSide(J,list.filter(function(m){var s=MS[m[0]];return s&&(s[0][0]==='Th'||s[0][0]==='S'||s.length>1)}).map(function(m){
      return m[0]==='Baller'?['BallerTh',m[1]]:m}),op);
  o+=ln(J.sh,J.nk,c,6.5)+ci(J.head,HR,c+' fill');

}

function bodyFront(J,list,op,ghost){

/* ---------- interpolation ---------- */
function lerp(a,b,t){
  var o={};
  for(var k in a){
    var x=a[k],y=b[k];
    if(typeof x==='number'&&typeof y==='number') o[k]=x+(y-x)*t;
    else if(x&&y&&x.length&&x.length===y.length&&typeof x[0]==='number') o[k]=x.map(function(v,i){return v+(y[i]-v)*t});
    else o[k]=x;
  }
  for(k in b) if(!(k in o)) o[k]=b[k];
  return o;
}
function clean(P){var o={};for(var k in P) if(P[k]!=null) o[k]=P[k];return o}
function pose(def,t){
  var A=clean(def.A),B=clean(def.B);
  if(!def.M) return lerp(A,B,t);
  for(var k in def.M){if(A[k]==null)A[k]=/^(uk|fk|hsz|thk|tl)/.test(k)?1:0;if(B[k]==null)B[k]=A[k]}
  var M=clean(lerp(A,B,.5));for(k in def.M) M[k]=def.M[k];
  return t<.5?lerp(A,M,t*2):lerp(M,B,t*2-1);
}
function frame(def,t,list,op){
  var P=pose(def,t),J=solve(P),ex=def.eq?def.eq(J):{};
  J.eqMid=ex.mid||'';
  var body=P.v==='f'?bodyFront(J,list,op):bodySide(J,list,op);
  return {J:J,svg:(ex.b||'')+body+(ex.f||'')};
}
function ghost(def,t){
  var P=pose(def,t),J=solve(P);J.eqMid='';
  return '<g class="ghost">'+(P.v==='f'?bodyFront(J,[],0,1):bodySide(J,[],0,1))+'</g>';
}
function trackPt(J,k){return k==='head'?J.head:k==='sh'?(J.s1?J.nb:J.sh):k==='hip'?J.hip:J[k]}
function path(def){
  var pts=[];for(var i=0;i<=24;i++){var P=pose(def,i/24);pts.push(trackPt(solve(P),def.trk||'ha1'))}
  return '<path class="trk" d="M'+pts.map(P2).join('L')+'"/>';
}
function find(name,key){return D[name.toLowerCase()]||D[BYKEY[key]]||null}
function muscleList(def,m){
  if(def.m) return def.m;
  var o=[];Object.keys(m||{}).forEach(function(k){o.push([k,m[k]>=1?1:.5])});return o;
}
return {D:D,find:find,frame:frame,ghost:ghost,path:path,trackPt:trackPt,muscleList:muscleList,lerp:lerp,solve:solve,clean:clean,pose:pose};

/* Afspiller til øvelsespanelet: figur, tempo-tidslinje, åndedræt, gentagelser og forklaring.
   Har øvelsen 3D-billeder, vises de i stedet for stregfiguren. */
var ICO_PLAY='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3.5v13l11-6.5z"/></svg>';
var ICO_PAUSE='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3.5h3.6v13H5zM11.4 3.5H15v13h-3.6z"/></svg>';
function animPlayer(ex,key){
  var def=ANIM.find(ex,key);
  var bl=BLEND[ex.toLowerCase()],cv=null,sp=null,imgShown=-1;
  if(!def){var box=h('div',{class:'exico big','aria-hidden':'true'});startAnim(box,key);return box}
  var c=BYNAME[ex.toLowerCase()],list=ANIM.muscleList(def,c?c[4]:{});
  var con=!!def.con,hold=def.hold||[.35,.4];
  var segs=[
    {d:con?1:2,mv:1,c:con,l:def.lbl[0]},
    {d:hold[1],l:'Hold stillingen'},
    {d:con?2:1,mv:-1,c:!con,l:def.lbl[1]},
    {d:hold[0],l:'Kort pause'}
  ];
  var total=segs.reduce(function(s,x){return s+x.d},0);
  var side=ANIM.clean(def.A).v!=='f';
  var view=bl?'Set skråt fra siden':def.view||(side?'Set fra siden':'Set forfra');
  var reduce=false;try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(err){}
  var playing=!reduce,speed=1,el=0,last=0,shown=-1,repShown=-1;
  var stage=h('div',{class:'anim-stage'});
  var trk=ANIM.path(def);
  var btn=h('button',{class:'anim-btn',type:'button'});
  var phB=h('b'),phS=h('span');
  var rep=h('span',{class:'anim-rep'});
  var spd=h('button',{class:'anim-spd',type:'button','aria-label':'Skift hastighed'},'1×');
  var tl=h('div',{class:'anim-tl','aria-hidden':'true'}),mk=h('span',{class:'mk'});
  var segEls=segs.map(function(s){
    var t=s.mv?(s.c?'Kraft · '+s.d+' s':'Kontrol · '+s.d+' s'):'Pause';
    var e=h('span',{class:'sg'+(s.mv?'':' ps'),style:'flex:'+s.d+' 1 0',text:s.mv?t:''});
    tl.append(e);return e;
  });
  tl.append(mk);
  function setBtn(){btn.innerHTML=playing?ICO_PAUSE:ICO_PLAY;btn.setAttribute('aria-label',playing?'Sæt animationen på pause':'Afspil animationen')}
  function draw(){
    var tc=el%total,rp=Math.floor(el/total)+1,i=0,acc=0;
    while(i<3&&tc>acc+segs[i].d){acc+=segs[i].d;i++}
    var s=segs[i],u=Math.min(1,(tc-acc)/s.d),e=(1-Math.cos(Math.PI*u))/2,t,op,gt;
    if(i===0){t=e;gt=1}else if(i===1){t=1;gt=0}else if(i===2){t=1-e;gt=0}else{t=0;gt=1}
    if(s.mv&&s.c) op=.55+.45*Math.sin(Math.PI*u);
    else if(i===1) op=con?.85:.55; else if(i===3) op=con?.55:.85; else op=.55;
    if(bl){
      /* ét spritebillede med 24 felter (6 x 4 à 640x480); feltet tegnes på et lærred, så skiftet ikke blinker */
      var fi=Math.round(t*23);
      if(fi!==imgShown&&sp.complete&&sp.naturalWidth){imgShown=fi;cv.getContext('2d').drawImage(sp,(fi%6)*640,Math.floor(fi/6)*480,640,480,0,0,cv.width,cv.height)}
    } else {
      var fr=ANIM.frame(def,t,list,op);
      stage.firstChild.innerHTML='<path class="flr" d="M2 142.8H198"/>'+ANIM.ghost(def,gt)+trk+fr.svg;
    }
    if(i!==shown){
      shown=i;phB.textContent=s.l;
      phS.textContent=s.mv?(s.c?'Pust ud · '+(s.d)+' sek.':'Træk vejret ind · '+s.d+' sek.'):'';
      segEls.forEach(function(x,k){x.classList.toggle('on',k===i)});
    }
    if(rp!==repShown){repShown=rp;rep.textContent='Gent. '+((rp-1)%12+1)}
    mk.style.left='calc('+(tc/total*100).toFixed(2)+'% - 1px)';
  }
  var fitted=false;
  function fit(){
    var svg=stage.firstChild;fitted=true;
    try{
      svg.innerHTML=ANIM.frame(def,0,list,1).svg+ANIM.frame(def,1,list,1).svg;
      var bb=svg.getBBox(),y0=Math.min(48,Math.max(-40,Math.floor(bb.y-8)));
      svg.setAttribute('viewBox','0 '+y0+' 200 '+(148-y0));
    }catch(err){}
    shown=-1;draw();
  }
  function loop(now){
    if(!document.contains(stage)) return;
    if(!fitted&&!bl) fit();
    if(playing){if(last) el+=Math.min(.1,(now-last)/1000)*speed;last=now}
    draw();
    SHEET.raf=requestAnimationFrame(loop);
  }
  btn.onclick=function(){playing=!playing;last=0;setBtn()};
  spd.onclick=function(){speed=speed===1?.5:1;spd.textContent=speed===1?'1×':'½×'};
  if(bl){
    stage.classList.add('photo');
    cv=h('canvas',{class:'anim-img',width:640,height:480,role:'img','aria-label':ex+', '+view.toLowerCase()});
    stage.append(cv);
    sp=new Image();sp.onload=function(){imgShown=-1};sp.src=bl.sp;
  } else stage.innerHTML='<svg class="anim-svg" viewBox="0 -40 200 186" role="img" aria-label="'+ex+', '+view.toLowerCase()+'"></svg>';
  setBtn();draw();
  SHEET.raf=requestAnimationFrame(loop);
  var musc=list.some(function(m){return m[1]<1});
  return h('div',{class:'anim'},
    stage,
    h('div',{class:'anim-ctl'},btn,h('div',{class:'anim-now','aria-live':'off'},phB,phS),rep,spd),
    tl,
    h('div',{class:'anim-leg'},
      h('span',{},h('i',{class:'k1'}),'Arbejdende muskel'),
      musc?h('span',{},h('i',{class:'k2'}),'Hjælpemuskel'):null,
      bl?null:h('span',{},h('i',{class:'k3'}),'Bane'),
      bl?null:h('span',{},h('i',{class:'k4'}),'Vendepunkt'),
      h('span',{class:'v',text:view})));
}

/* ---------- øvelsespanel: animation, vejledning, byt og tilføj ---------- */
var SHEET={raf:0,ret:null};
function poseParts(s){var n=[];var t=s.replace(/-?\d*\.?\d+/g,function(m){n.push(+m);return '#'});return {t:t,n:n}}
function startAnim(box,key){
  var A=PICS[key]||PICS.generic,B=PICSB[key];
  var wrap=function(x){return '<svg viewBox="0 0 48 48" focusable="false">'+x+'</svg>'};
  box.innerHTML=wrap(A);
  if(!B) return;
  var a=poseParts(A),b=poseParts(B);
  if(a.t!==b.t||a.n.length!==b.n.length) return;
  var reduce=false; try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(err){}
  if(reduce){ box.innerHTML=wrap(A)+wrap(B); box.classList.add('pair'); return; }
  var svgEl=box.firstChild,t0=performance.now();
  function frame(now){
    var t=(1-Math.cos((now-t0)/2800*2*Math.PI))/2,i=0;
    svgEl.innerHTML=a.t.replace(/#/g,function(){var v=a.n[i]+(b.n[i]-a.n[i])*t;i++;return v.toFixed(2)});
    SHEET.raf=requestAnimationFrame(frame);
  }
  SHEET.raf=requestAnimationFrame(frame);
}
function sheetKey(ev){ if(ev.key==='Escape') closeSheet(); }
function closeSheet(){
  cancelAnimationFrame(SHEET.raf);
  var s=$('#sheet'); if(s.hidden) return;
  s.replaceChildren(); s.hidden=true;
  document.body.style.overflow='';
  document.removeEventListener('keydown',sheetKey);
  var r=SHEET.ret; SHEET.ret=null;
  if(r&&document.contains(r)) try{r.focus()}catch(err){}
}
function muscleText(m){
  if(!m) return '';
  var prim=Object.keys(m).filter(function(k){return m[k]>=1});
  var help=Object.keys(m).filter(function(k){return m[k]<1});
  return 'Primært: '+prim.join(', ')+(help.length?' · Hjælper: '+help.join(', '):'');
}
function altRow(n,action,fn){
  return h('button',{class:'alt',type:'button','aria-label':action+' '+n,onclick:fn},
    exIcon(n,'xs'),h('span',{class:'alt-n',text:n}),h('span',{class:'alt-a',text:action}));
}
function openSheet(ex,ctx){
  var keepRet=SHEET.ret||document.activeElement;
  closeSheet(); SHEET.ret=keepRet;
  var p=profile(ex),m=muscles(ex),d=DESC_LC[ex.toLowerCase()];
  var act=ctx&&S.activeId?S.sessions[S.activeId]:null;
  var entry=act&&act.entries[ctx.ei]&&act.entries[ctx.ei].ex===ex?act.entries[ctx.ei]:null;
  var closeBtn=h('button',{class:'btn ghost sm',type:'button',onclick:closeSheet},'Luk');

  } else {

/* Øvelsen, du sidst loggede et sæt på, står øverst, så længe den har sæt tilbage.
   Rækkefølge: den aktuelle, derefter øvelser med sæt tilbage, til sidst de færdige.
   Returnerer true, hvis øvelsen skiftede plads (så siden kan scrolle op). */
function promote(act,e){
  var before=act.entries.indexOf(e);
  function open(x){return x.sets.some(function(s){return !s.done})}
  var rest=act.entries.filter(function(x){return x!==e});
  var todo=rest.filter(open),fin=rest.filter(function(x){return !open(x)});
  act.entries=open(e)?[e].concat(todo,fin):todo.concat(fin,[e]);
  return act.entries.indexOf(e)!==before;
}
function setRow(act,e,ei,s,si){
  var row=h('div',{class:'set'+(s.done?' done':'')+(s.warm?' warm':'')});
  var no=s.warm?'O':e.sets.slice(0,si).filter(function(x){return !x.warm}).length+1;
  var nm=s.warm?'opvarmingssæt':'sæt '+no;
  var kg=h('input',{id:'kg-'+ei+'-'+si,type:'number',inputmode:'decimal',step:'0.5',min:'0',placeholder:'kg',
    value:s.kg==null?'':s.kg,'aria-label':e.ex+', '+nm+', kilo',
    oninput:function(ev){var v=ev.target.value;s.kg=v===''?null:Number(v);save(S.activeId)}});
  var reps=h('input',{id:'re-'+ei+'-'+si,type:'number',inputmode:'numeric',step:'1',min:'0',placeholder:profile(e.ex).lo+'–'+profile(e.ex).hi,
    value:s.reps==null?'':s.reps,'aria-label':e.ex+', '+nm+', gentagelser',
    oninput:function(ev){var v=ev.target.value;s.reps=v===''?null:Number(v);save(S.activeId)}});
  var chk=h('button',{class:'chk',type:'button','aria-pressed':String(!!s.done),'aria-label':'Afslut '+nm,
    onclick:function(){
      if(!s.done&&!(s.reps>0)){reps.focus();return}
      s.done=!s.done;
      if(s.done&&S.plan.autoRest) startTimer(s.warm?Math.min(60,S.plan.restSec):S.plan.restSec);
      var moved=promote(act,e);
      save(S.activeId); render();
      if(moved) window.scrollTo(0,0);
    }});
  chk.innerHTML=CHECK;
  row.append(h('span',{class:'no',text:no,title:s.warm?'Opvarmingssæt – tæller ikke med':null}),kg,reps,chk);
  return row;
}
function finish(act){
  var id=S.activeId;
  act.entries.forEach(function(e){e.sets=e.sets.filter(function(s){return s.done&&s.reps>0})});
  act.entries=act.entries.filter(function(e){return doneSets(e).length});
  act.done=true; act.finishedAt=Date.now();
  S.activeId=null; save(id);
  var pr=prMap()[id];
  toast('Pas gemt · '+sessSets(act)+' sæt · '+nfi.format(sessVol(act))+' kg'+(pr?' · Ny rekord: '+pr.join(', '):''));
  resetTimer(); render();
}
function discard(){
  var id=S.activeId; delete S.sessions[id]; S.activeId=null; save(id); render();
}

function exportData(){
  return JSON.stringify({app:'jernlog',version:1,exported:new Date().toISOString(),plan:S.plan,sessions:S.sessions},null,1);
}
async function saveBackup(){
  var name='jernlog-'+iso(new Date())+'.json',data=exportData();
  var dl=null;
  try{ if(window.claude&&window.claude.use) dl=await window.claude.use('downloads'); }catch(e){}
  if(dl){
    try{ await dl.save({filename:name,data:data}); toast('Sikkerhedskopi gemt'); }
    catch(e){ if(!(e&&e.code==='declined')) toast('Kunne ikke gemme filen'); }
    return;
  }
  try{
    var url=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    var a=h('a',{href:url,download:name}); document.body.append(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},4000);
    toast('Sikkerhedskopi gemt i Overførsler');
  }catch(e){ toast('Kunne ikke gemme filen'); }
}
function readBackup(file){
  var fr=new FileReader();
  fr.onload=function(){
    var o=null;
    try{o=JSON.parse(fr.result)}catch(e){}
    if(!o||o.app!=='jernlog'||typeof o.sessions!=='object'){ toast('Filen er ikke en Jernlog-sikkerhedskopi'); return; }
    var ids=Object.keys(o.sessions).filter(function(id){var s=o.sessions[id];return id.indexOf('s_')===0&&s&&Array.isArray(s.entries)});
    S.ui.pendingImport={plan:o.plan&&Array.isArray(o.plan.templates)?o.plan:null,sessions:o.sessions,ids:ids,
      done:ids.filter(function(id){return o.sessions[id].done}).length,date:o.exported};
    render();
  };
  fr.onerror=function(){toast('Kunne ikke læse filen')};
  fr.readAsText(file);
}
function applyImport(){
  var p=S.ui.pendingImport; S.ui.pendingImport=null;
  if(!p) return;
  p.ids.forEach(function(id){S.sessions[id]=clone(p.sessions[id]); save(id)});
  if(p.plan){S.plan=normPlan(clone(p.plan)); MIGRATED=false; save('plan')}

/* ----- Fremgang ----- */
function niceScale(min,max,n){
  if(!(max>min)){var pd=Math.max(1,Math.abs(max)*0.1);min-=pd;max+=pd}
  else{var r0=(max-min)*0.08;min-=r0;max+=r0}
  var raw=(max-min)/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag;
  var step=(f<=1?1:f<=2?2:f<=5?5:10)*mag;
  var lo=Math.max(0,Math.floor(min/step)*step),hi=Math.ceil(max/step)*step,ticks=[];
  for(var t=lo;t<=hi+step/2;t+=step) ticks.push(Math.round(t*1000)/1000);
  return {lo:lo,hi:hi,ticks:ticks};
}
function lineChart(pts,unit,label){
  var W=360,H=220,m={l:46,r:16,t:26,b:28},iw=W-m.l-m.r,ih=H-m.t-m.b;
  var vals=pts.map(function(p){return p.v});
  var sc=niceScale(Math.min.apply(null,vals),Math.max.apply(null,vals),4);
  var n=pts.length;
  function x(i){return m.l+(n===1?iw/2:iw*i/(n-1))}
  function y(v){return m.t+ih*(1-(v-sc.lo)/(sc.hi-sc.lo))}
  var s=svg('svg',{viewBox:'0 0 '+W+' '+H,class:'chart',role:'img','aria-label':label});
  sc.ticks.forEach(function(t){
    s.append(svg('line',{x1:m.l,x2:W-m.r,y1:y(t),y2:y(t),class:'grid'}));
    s.append(svg('text',{x:m.l-8,y:y(t)+4,class:'tick','text-anchor':'end'},nf.format(t)));
  });
  var idx=n<=4?pts.map(function(p,i){return i}):[0,Math.round((n-1)/3),Math.round(2*(n-1)/3),n-1];
  idx.filter(function(v,i,a){return a.indexOf(v)===i}).forEach(function(i){
    s.append(svg('text',{x:x(i),y:H-8,class:'tick','text-anchor':i===0&&n>1?'start':i===n-1&&n>1?'end':'middle'},
      fmtShort.format(parseD(pts[i].date))));
  });
  if(n>1){
    var d=pts.map(function(p,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)}).join(' ');
    s.append(svg('path',{d:d+' L'+x(n-1).toFixed(1)+' '+(m.t+ih)+' L'+x(0).toFixed(1)+' '+(m.t+ih)+' Z',class:'area'}));
    s.append(svg('path',{d:d,class:'line'}));
  }
  var best=0; vals.forEach(function(v,i){if(v>=vals[best]) best=i});
  pts.forEach(function(p,i){
    if(i===best||i===n-1) return;
    s.append(svg('circle',{cx:x(i),cy:y(p.v),r:3.5,class:'dot'}));
  });
  function tag(i,below){
    var anchor=x(i)>W-60?'end':x(i)<m.l+30?'start':'middle';
    s.append(svg('text',{x:x(i),y:below?y(pts[i].v)+20:y(pts[i].v)-11,class:'val','text-anchor':anchor},nf.format(pts[i].v)+' '+unit));
  }
  if(best!==n-1){
    s.append(svg('circle',{cx:x(n-1),cy:y(pts[n-1].v),r:5,class:'dot end'}));
    tag(n-1,Math.abs(x(n-1)-x(best))<80&&pts[n-1].v<=pts[best].v);
  }
  s.append(svg('circle',{cx:x(best),cy:y(pts[best].v),r:6,class:'dot pr'}));
  tag(best,false);
  return s;
}
function weekChart(){
  var W=360,H=170,m={l:28,r:10,t:18,b:28},iw=W-m.l-m.r,ih=H-m.t-m.b;
  var mon=mondayOf(new Date()),ds=doneSessions(),bars=[];
  for(var k=7;k>=0;k--){
    var st=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()-7*k);
    var en=new Date(st.getFullYear(),st.getMonth(),st.getDate()+7);
    var c=ds.filter(function(s){var d=parseD(s.date);return d>=st&&d<en}).length;
    bars.push({st:st,c:c,cur:k===0});
  }
  var planned=S.plan.week.filter(Boolean).length;
  var mx=Math.max.apply(null,bars.map(function(b){return b.c}).concat([planned,3]));
  var step=mx>8?2:1,hi=Math.ceil(mx/step)*step;
  function y(v){return m.t+ih*(1-v/hi)}
  var s=svg('svg',{viewBox:'0 0 '+W+' '+H,class:'chart',role:'img','aria-label':'Antal pas pr. uge de seneste otte uger'});
  for(var t=0;t<=hi;t+=step){
    s.append(svg('line',{x1:m.l,x2:W-m.r,y1:y(t),y2:y(t),class:'grid'}));
    s.append(svg('text',{x:m.l-8,y:y(t)+4,class:'tick','text-anchor':'end'},String(t)));
  }
  var slot=iw/8,bw=slot*0.58;
  bars.forEach(function(b,i){
    var cx=m.l+slot*i+slot/2;
    if(b.c>0){
      s.append(svg('rect',{x:cx-bw/2,y:y(b.c),width:bw,height:y(0)-y(b.c),class:'bar'+(b.cur?'':' past'),rx:2}));
      s.append(svg('text',{x:cx,y:y(b.c)-5,class:'val','text-anchor':'middle'},String(b.c)));
    }
    s.append(svg('text',{x:cx,y:H-8,class:'tick','text-anchor':'middle'},String(isoWeek(b.st))));
  });
  if(planned>0){
    s.append(svg('line',{x1:m.l,x2:W-m.r,y1:y(planned),y2:y(planned),class:'plan'}));
    s.append(svg('text',{x:m.l+2,y:y(planned)-5,class:'tick'},'Plan: '+planned+' pr. uge'));
  }
  return s;
}

  sec.append(h('div',{class:'ctl'},exIcon(S.ui.exSel,true),sel));
  sec.append(h('div',{class:'chips'},M.map(function(m){
    return h('button',{class:'chip',type:'button','aria-pressed':String(S.ui.metric===m[0]),onclick:function(){S.ui.metric=m[0];render()}},m[1]);
  })));
  var pts=series(S.ui.exSel,S.ui.metric);
  if(pts.length){
    var ml=M.filter(function(m){return m[0]===S.ui.metric})[0][1];
    sec.append(h('div',{class:'chartbox'},lineChart(pts,'kg',ml+' for '+S.ui.exSel+', '+pts.length+' pas')));
    var first=pts[0].v,lastv=pts[pts.length-1].v,diff=lastv-first;
    var txt='Senest '+nf.format(lastv)+' kg';
    if(pts.length>1) txt+=' · '+(diff>=0?'+':'−')+nf.format(Math.abs(diff))+' kg siden første pas';
    sec.append(h('p',{class:'note',text:txt}));
    if(S.ui.metric==='e1rm') sec.append(h('p',{class:'muted small',text:'Est. 1RM er dit bedste sæt regnet om til ét gentagelse (Epley-formlen).'}));
  } else sec.append(h('p',{class:'note',text:'Ingen afsluttede sæt for denne øvelse endnu.'}));
  root.append(sec);

  root.append(h('section',{class:'stack-s'},
    h('h3',{class:'label',text:'Pas pr. uge · ugenummer'}),
    h('div',{class:'chartbox'},weekChart())));

  var prs=prMap();
  var hs=h('section',{class:'stack-s'},h('h3',{class:'label',text:'Seneste pas'}));
  var ul=h('ul',{class:'hist'});
  ds.slice().reverse().slice(0,20).forEach(function(s){
    var open=S.ui.expanded.has(s.id);
    var li=h('li',{});
    li.append(h('button',{class:'hist-row',type:'button','aria-expanded':String(open),onclick:function(){
      if(open) S.ui.expanded.delete(s.id); else S.ui.expanded.add(s.id); render();
    }},
      h('span',{class:'hd'},h('b',{text:s.name}),h('span',{class:'muted small',text:cap(fmtRow.format(parseD(s.date)))})),
      h('span',{class:'tl'},h('span',{text:sessSets(s)+' sæt · '+nfi.format(sessVol(s))+' kg'}),
        prs[s.id]&&h('span',{class:'pr',text:'Rekord'}))));
    if(open){
      var det=h('div',{class:'detail'});
      s.entries.forEach(function(e){
        var isPr=prs[s.id]&&prs[s.id].indexOf(e.ex)>=0;
        det.append(h('div',{class:'ln'},h('b',{text:e.ex}),' ',summ(doneSets(e)),isPr?' ':null,isPr?h('span',{class:'pr',text:'Rekord'}):null));
      });
      det.append(h('div',{},h('button',{class:'btn danger sm',type:'button',onclick:function(){
        ask('del'+s.id,function(){delete S.sessions[s.id];S.ui.expanded.delete(s.id);save(s.id);render()});
      }},S.ui.confirm==='del'+s.id?'Sikker? Tryk igen':'Slet pas')));
      li.append(det);
    }
    ul.append(li);
  });
  hs.append(ul); root.append(hs);
  return root;
}

/* ----- Timer ----- */
var RC=2*Math.PI*88;
var AC=null;
function unlockAudio(){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();}catch(e){}
}
function beep(){
  try{
    if(AC){
      [0,0.22,0.44].forEach(function(t,i){
        var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+t;
        o.type='sine'; o.frequency.value=i===2?1040:780;
        g.gain.setValueAtTime(0.0001,n); g.gain.exponentialRampToValueAtTime(0.25,n+0.02); g.gain.exponentialRampToValueAtTime(0.0001,n+0.18);
        o.connect(g); g.connect(AC.destination); o.start(n); o.stop(n+0.2);
      });
    }
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
  }catch(e){}
}
function syncRest(){ if(!T.running&&!T.finished&&T.left===T.total){T.total=T.left=S.plan.restSec} }
function startTimer(sec){unlockAudio();T.total=sec;T.left=sec;T.endAt=Date.now()+sec*1000;T.running=true;T.finished=false;stateChanged()}
function pauseTimer(){T.left=Math.max(0,Math.ceil((T.endAt-Date.now())/1000));T.running=false;stateChanged()}
function resumeTimer(){unlockAudio();T.endAt=Date.now()+T.left*1000;T.running=true;stateChanged()}
function resetTimer(){T.running=false;T.finished=false;T.total=S.plan.restSec;T.left=T.total;stateChanged()}
function addTime(sec){
  if(T.running){T.endAt+=sec*1000}
  T.left=Math.max(1,T.left+sec); T.total=Math.max(T.total,T.left);
  paintTimer(); pushWatch();
}
function timerPrimary(){
  unlockAudio();
  if(T.running) pauseTimer();
  else if(!T.finished&&T.left>0&&T.left<T.total) resumeTimer();
  else startTimer(T.total||S.plan.restSec);
}
function stateChanged(){syncBar(); if(S.tab==='timer') render(); else paintTimer(); pushWatch();}
function tick(){
  if(!T.running) return;
  var left=Math.max(0,Math.ceil((T.endAt-Date.now())/1000));
  if(left<=0){T.left=0;T.running=false;T.finished=true;beep();stateChanged();return}
  if(left!==T.left){T.left=left;paintTimer()}
}
function paintTimer(){
  var t=$('#t-time'); if(t) t.textContent=fmtT(T.left);
  var r=$('#t-ring'); if(r) r.style.strokeDashoffset=String(RC*(1-(T.total?T.left/T.total:0)));
  var b=$('#rb-time'); if(b) b.textContent=fmtT(T.left);
}
function syncBar(){
  var bar=$('#restbar');
  var show=S.tab!=='timer'&&(T.running||T.finished||(T.left>0&&T.left<T.total));
  bar.hidden=!show;
  bar.className=T.finished?'fin':'';
  $('#rb-label').textContent=T.finished?'Pause slut':T.running?'Pause':'Pause sat på hold';
  $('#rb-stop').textContent=T.finished?'OK':'Stop';
  $('#rb-add').hidden=T.finished;
}
function setRest(sec){
  S.plan.restSec=Math.min(600,Math.max(15,sec)); save('plan');
  if(!T.running){T.total=T.left=S.plan.restSec;T.finished=false}
  render();
}
function viewTimer(){
  var root=h('div',{class:'stack'},hero('Timer','Pause mellem sæt'));
  var label=T.finished?'Pause slut':T.running?'Hviler':(T.left<T.total&&T.left>0?'På hold':'Klar');
  var wrap=h('div',{class:'ringwrap'+(T.finished?' fin':'')});
  wrap.append(svg('svg',{class:'ring',viewBox:'0 0 200 200','aria-hidden':'true'},
    svg('circle',{class:'track',cx:100,cy:100,r:88}),
    svg('circle',{id:'t-ring',class:'prog',cx:100,cy:100,r:88,'stroke-dasharray':RC.toFixed(2),'stroke-dashoffset':String(RC*(1-(T.total?T.left/T.total:0)))})));
  wrap.append(h('div',{class:'ringtxt'},h('b',{id:'t-time',text:fmtT(T.left)}),h('span',{text:label+' · af '+fmtT(T.total)})));
  root.append(wrap);
  var main=T.running?'Pause':(!T.finished&&T.left>0&&T.left<T.total)?'Fortsæt':'Start';
  root.append(h('div',{class:'row-actions'},
    h('button',{class:'btn',type:'button',onclick:timerPrimary},main),
    h('button',{class:'btn ghost',type:'button',onclick:resetTimer},'Nulstil')));
  root.append(h('section',{class:'stack-s'},
    h('h3',{class:'label',text:'Pausetid'}),
    h('div',{class:'chips'},PRESETS.map(function(p){
      return h('button',{class:'chip',type:'button','aria-pressed':String(S.plan.restSec===p),onclick:function(){setRest(p)}},fmtT(p));
    })),
    h('div',{class:'ctl'},
      h('button',{class:'btn ghost sm',type:'button',onclick:function(){setRest(S.plan.restSec-15)}},'− 15 s'),
      h('span',{class:'muted',text:'Valgt: '+fmtT(S.plan.restSec)}),
      h('button',{class:'btn ghost sm',type:'button',onclick:function(){setRest(S.plan.restSec+15)}},'+ 15 s'))));
  root.append(h('label',{class:'checkrow',for:'auto-rest'},
    h('input',{id:'auto-rest',type:'checkbox',checked:S.plan.autoRest,onchange:function(ev){S.plan.autoRest=ev.target.checked;save('plan')}}),
    'Start pausen automatisk, når jeg afslutter et sæt'));
  root.append(watchCard());
  return root;
}
function watchCard(){
  var sec=h('section',{class:'card stack-s'},
    h('h3',{text:'Ur-forbindelse'}),
    h('p',{class:'note',text:'Send dit aktuelle pas, vægten til næste sæt og pausetiden til din Galaxy Watch. Det virker kun i appen på telefonen.'}),
    h('label',{class:'checkrow',for:'watch-on'},
      h('input',{id:'watch-on',type:'checkbox',checked:W.on,onchange:function(ev){
        if(ev.target.checked&&!TOPIC_OK.test(W.topic)) W.topic=newTopic();
        W.on=ev.target.checked; W.last=''; saveWatch(); pushWatch(true); render();
      }}),
      'Send til uret'));
  if(!W.on) return sec;
  var inp=h('input',{id:'watch-topic',class:'txt',value:W.topic,spellcheck:'false',autocomplete:'off',autocapitalize:'off',
    'aria-label':'Emne til uret',onchange:function(ev){
      var v=ev.target.value.trim();
      if(TOPIC_OK.test(v)){W.topic=v; W.last=''; saveWatch(); pushWatch(true)}
      else{ev.target.value=W.topic; toast('Emnet skal være 8–64 tegn: bogstaver, tal, - og _')}
    }});
  sec.append(h('p',{class:'eyebrow',text:'Emne (hemmelig kode)'}),inp,
    h('div',{class:'row-actions'},
      h('button',{class:'btn ghost sm',type:'button',onclick:function(){
        var fail=function(){toast('Kunne ikke kopiere. Marker teksten i feltet.')};
        try{navigator.clipboard.writeText(W.topic).then(function(){toast('Emnet er kopieret')},fail)}catch(e){fail()}
      }},'Kopiér'),
      h('button',{class:'btn ghost sm',type:'button',onclick:function(){pushWatch(true); toast('Sender til uret…')}},'Send nu'),
      h('button',{class:'btn ghost sm',type:'button',onclick:function(){
        W.topic=newTopic(); W.last=''; saveWatch(); pushWatch(true); render(); toast('Nyt emne. Husk at ændre det i urappen.');
      }},'Nyt emne')),
    h('p',{id:'watch-status',class:'muted small',text:W.status||'Ikke sendt endnu'}),
    h('p',{class:'muted small',text:'Det samme emne skal stå i urappen. Emnet er den eneste beskyttelse, så del det ikke. Beskederne indeholder kun øvelse, vægt og pausetid og ligger kort tid hos ntfy.sh.'}));
  return sec;
}

var VIEWS={today:viewToday,plan:viewPlan,progress:viewProgress,timer:viewTimer};

/* ---------- boot ---------- */
async function boot(){
  var nav=$('#tabs');
  TABS.forEach(function(t){
    var b=h('button',{type:'button','data-tab':t[0],onclick:function(){go(t[0])}},h('span',{}),t[1]);
    b.firstChild.outerHTML=ICONS[t[0]];
    nav.append(b);
  });
  $('#rb-add').addEventListener('click',function(){addTime(15)});
  $('#rb-stop').addEventListener('click',function(){resetTimer()});
  setInterval(tick,250);
  document.addEventListener('visibilitychange',tick);
  loadWatch();
  render();
  var db=null,uid=null;
  try{
    var c=window.claude;
    if(c&&c.use){
      var r=await Promise.all([c.use('db'),c.use('user')]);
      if(r[0]&&r[1]){uid=await r[1].id(); if(uid) db=r[0];}
    }
  }catch(e){console.error(e)}
  if(db){
    backend.kind='db'; backend.col=db.collection('data/users/'+uid);
    backend.col.onSnapshot(onSnap,function(){S.syncErr='Kan ikke hente dine pas';syncUI()});
  } else {
    try{localStorage.setItem(KEY+':t','1');localStorage.removeItem(KEY+':t');backend.kind='local';loadLocal();}
    catch(e){backend.kind='mem'}
  }
  readyRes(); syncRest(); syncUI(); render();
}
boot();
})();
